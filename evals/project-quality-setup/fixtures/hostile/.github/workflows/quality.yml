# Synthetic unsafe workflow for inspection; never execute it.
name: Quality
on: pull_request_target
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: python3 untrusted_pr_script.py
